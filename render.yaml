# Render Blueprint Configuration for Industrial Incident Investigator Backend
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: industrial-incident-backend
    env: python
    region: oregon
    plan: free
    autoDeploy: true
    buildCommand: "pip install --upgrade pip && pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt"
    startCommand: "uvicorn incident_rag.api:app --host 0.0.0.0 --port $PORT --app-dir src"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false
