# Render Blueprint Configuration for Industrial Incident Investigator Backend
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: industrial-incident-backend
    env: python
    region: oregon
    plan: free
    autoDeploy: false
    buildCommand: "pip install --upgrade pip && pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt"
    startCommand: "uvicorn incident_rag.api:app --host 0.0.0.0 --port $PORT --workers 1 --app-dir src"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: AUTO_SEED_DATA
        value: "false"
      - key: ENABLE_RERANKER
        value: "false"
      - key: EMBEDDING_BATCH_SIZE
        value: "2"
      - key: MAX_CONCURRENT_UPLOADS
        value: "1"
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false
